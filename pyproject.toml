[project]
name = "field-repair-tracker-lab"
version = "0.1.0"
description = "Tutorial 6: AI-assisted SDLC laboratory starter"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-cov>=5,<8", "pre-commit>=4,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
